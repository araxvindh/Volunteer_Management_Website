name: MERN CI

on:
  push:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "18"

      - name: Wait for MongoDB
        run: |
          echo "Waiting for MongoDB..."

          until nc -z 127.0.0.1 27017; do
            sleep 2
          done

          echo "MongoDB is ready!"

      - name: Install dependencies
        working-directory: ./backend
        run: npm install

      - name: Seed MongoDB
        working-directory: ./backend
        env:
          MONGODB_URL: mongodb://127.0.0.1:27017/volunteer_management_ci
        run: node seedtaskdata.js

      - name: Run tests
        working-directory: ./backend
        env:
          MONGODB_URL: mongodb://127.0.0.1:27017/volunteer_management_ci
        run: npm test -- --runInBand